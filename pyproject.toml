[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "krinik-epub-linter"
version = "0.1.0"
description = "Krinik EPUB Linter — проверка и причёсывание сносок в EPUB-книгах"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
proofread = ["language_tool_python>=2.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
krinik-epub-linter = "krinik_epub_linter:main"

[tool.setuptools]
py-modules = ["krinik_epub_linter", "krinik_proofread"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
